name: Publish wickedapi-mcp (forwarding shim)

# Publishes the tiny `wickedapi-mcp` forwarding package in ./shim to npm via
# trusted publishing (OIDC): no token or one-time code. The trusted publisher is
# configured on npmjs.com for `wickedapi-mcp` -> GitHub Actions ->
# choaticpixels/wicked-mcp, workflow publish.yml. The real package,
# @wickedlabs/wicked-mcp, is published separately.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run against wickedapi-mcp"
        type: choice
        options: [publish, deprecate-old-versions]
        default: publish

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@^11.5.1
      - if: ${{ inputs.action == 'publish' }}
        run: npm publish --access public --provenance
      # Mark every pre-shim version as moved. Needs write access to the package;
      # trusted publishing is documented for `npm publish` only, so this may be refused.
      - if: ${{ inputs.action == 'deprecate-old-versions' }}
        run: npm deprecate "wickedapi-mcp@<0.5.1" "Moved to @wickedlabs/wicked-mcp. Use wickedapi-mcp@latest (forwards automatically) or switch to npx -y @wickedlabs/wicked-mcp."
