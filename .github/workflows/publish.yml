name: Publish to npm

# npm trusted publishing (OIDC): no npm token or one-time code is stored or
# needed. Configure once on npmjs.com -> wickedapi-mcp -> Settings -> Trusted
# Publisher -> GitHub Actions (repo choaticpixels/wicked-mcp, workflow publish.yml).
# Run manually from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public --provenance
